<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Principal - Gestão</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- ESTILO GERAL --- */
        :root { 
            --primary-color: #2563eb; 
            --bg-color: #f3f4f6; 
            --text-color: #1f2937; 
            --card-bg: #ffffff; 
            --manager-bg: #f5f3ff;
            --manager-border: #8b5cf6;
            --manager-text: #4c1d95;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        
        .container { max-width: 1000px; margin: 0 auto; }

        /* Barra Superior */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-bar h1 { color: #111827; font-size: 1.8rem; }

        /* Card do Usuário (Topo) */
        .user-info { 
            display: flex; align-items: center; gap: 15px; background: white; 
            padding: 10px 20px; border-radius: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        .user-details { display: flex; flex-direction: column; line-height: 1.2; }
        .user-name { font-weight: bold; font-size: 0.95rem; color: #374151; }
        .user-role { font-size: 0.75rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .btn-logout {
            border: none; background: none; color: #dc2626; cursor: pointer; 
            font-size: 1.1rem; transition: 0.2s; padding: 5px;
        }
        .btn-logout:hover { color: #b91c1c; transform: scale(1.1); }

        /* Dashboard (Gráfico) */
        .chart-section { 
            background: var(--card-bg); padding: 30px; border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px;
            display: flex; flex-direction: column; align-items: center;
        }
        .chart-container { position: relative; height: 250px; width: 250px; margin-top: 10px; }
        
        /* Legenda */
        .finance-summary { 
            display: flex; gap: 40px; margin-top: 25px; text-align: center; 
            border-top: 1px solid #e5e7eb; padding-top: 20px; width: 100%; justify-content: center;
        }
        .finance-item h4 { font-size: 0.9rem; color: #6b7280; font-weight: normal; margin-bottom: 5px; }
        .finance-item p { font-size: 1.4rem; font-weight: bold; }
        .text-red { color: #dc2626; }
        .text-green { color: #16a34a; }

        /* Menu Principal */
        .menu-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; 
        }
        
        .menu-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--card-bg); padding: 30px 20px; border-radius: 15px;
            text-decoration: none; color: var(--text-color); font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s;
            border: none; cursor: pointer; font-size: 1.1rem; gap: 15px;
        }
        .menu-btn:hover { transform: translateY(-3px); background-color: #eff6ff; }
        .menu-btn i { font-size: 2.5rem; color: var(--primary-color); }

        /* --- ÁREA GERENCIAL (Exclusiva) --- */
        #managerSection {
            display: none; /* Escondido por padrão, o JS ativa */
            grid-column: 1 / -1; /* Ocupa toda a largura */
            background-color: var(--manager-bg);
            border: 2px dashed var(--manager-border);
            border-radius: 15px;
            padding: 20px;
            margin-top: 10px;
        }
        
        .manager-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: var(--manager-text);
        }
        
        .manager-grid {
            display: flex; gap: 20px;
        }

        .btn-manager {
            flex: 1; /* Botões ocupam tamanho igual */
            background-color: white; color: var(--manager-text);
            border: 1px solid var(--manager-border);
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
            padding: 20px; border-radius: 10px; font-weight: 600; gap: 10px; cursor: pointer;
            transition: 0.2s;
        }
        .btn-manager i { color: #7c3aed; font-size: 1.5rem; }
        .btn-manager:hover { background-color: #ede9fe; transform: translateY(-2px); }

    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h1>Gestão Financeira</h1>
            <div class="user-info">
                <i class="fas fa-user-circle fa-2x" style="color: #6b7280;"></i>
                <div class="user-details">
                    <span class="user-name" id="nomeUsuarioDisplay">Carregando...</span>
                    <span class="user-role" id="cargoDisplay">...</span>
                </div>
                <div style="width: 1px; height: 30px; background: #e5e7eb; margin: 0 5px;"></div>
                <button class="btn-logout" onclick="fazerLogout()" title="Sair do Sistema">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <div class="chart-section">
            <h3 style="color: #374151;">Balanço da Empresa</h3>
            <p style="color: #9ca3af; font-size: 0.9rem;">Custo de Estoque vs. Faturamento</p>
            
            <div class="chart-container">
                <canvas id="graficoBalanco"></canvas>
            </div>

            <div class="finance-summary">
                <div class="finance-item">
                    <h4>Dinheiro em Estoque</h4>
                    <p id="txtInvestimento" class="text-red">R$ 0,00</p>
                </div>
                <div class="finance-item">
                    <h4>Faturamento Total</h4>
                    <p id="txtFaturamento" class="text-green">R$ 0,00</p>
                </div>
            </div>
        </div>

        <div class="menu-grid">
            <a href="pdv.html" class="menu-btn">
                <i class="fas fa-cash-register"></i> <span>Nova Venda</span>
            </a>

            <a href="estoque.html" class="menu-btn">
                <i class="fas fa-boxes"></i> <span>Estoque</span>
            </a>

            <a href="#" class="menu-btn" onclick="alert('Em desenvolvimento')">
                <i class="fas fa-users"></i> <span>Clientes</span>
            </a>

            <div id="managerSection">
                <div class="manager-header">
                    <i class="fas fa-lock"></i>
                    <h3>Área Gerencial</h3>
                </div>
                
                <div class="manager-grid">
                    <a href="historico.html" class="btn-manager">
                        <i class="fas fa-list-ul"></i>
                        <span>Auditoria / Logs</span>
                    </a>

                    <button class="btn-manager" onclick="location.href='cadastro-funcionario.html'">
                        <i class="fas fa-user-tie"></i>
                        <span>Cadastrar Equipe</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SEGURANÇA: Verifica se está logado ---
        const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));

        if (!usuarioLogado) {
            window.location.href = 'login.html'; // Redireciona se não tiver login
        } else {
            // Preenche o cabeçalho
            document.getElementById('nomeUsuarioDisplay').innerText = usuarioLogado.nome;
            document.getElementById('cargoDisplay').innerText = usuarioLogado.cargo;
        }

        // --- 2. PERMISSÕES: Mostra/Esconde Área Gerencial ---
        function aplicarPermissoes() {
            const areaGerente = document.getElementById('managerSection');
            
            if (usuarioLogado && usuarioLogado.cargo === 'gerente') {
                areaGerente.style.display = 'block';
            } else {
                areaGerente.style.display = 'none';
            }
        }

        // --- 3. GRÁFICO: Carrega dados do Backend ---
        let graficoBalanco;
        async function carregarBalanco() {
            try {
                const response = await fetch('http://localhost:3000/dashboard/resumo');
                const dados = await response.json();
                
                document.getElementById('txtInvestimento').innerText = formatarMoeda(dados.investimento);
                document.getElementById('txtFaturamento').innerText = formatarMoeda(dados.faturamento);

                const ctx = document.getElementById('graficoBalanco').getContext('2d');
                if (graficoBalanco) graficoBalanco.destroy();

                graficoBalanco = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Investido (Custo)', 'Faturamento (Vendas)'],
                        datasets: [{
                            data: [dados.investimento, dados.faturamento],
                            backgroundColor: ['#ef4444', '#22c55e'],
                            borderWidth: 0
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });
            } catch (error) { console.error("Erro gráfico", error); }
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // --- 4. LOGOUT ---
        function fazerLogout() {
            if(confirm("Deseja realmente sair?")) {
                localStorage.removeItem('usuarioLogado');
                window.location.href = 'login.html';
            }
        }

        // INICIALIZAÇÃO
        window.onload = function() {
            if (usuarioLogado) { // Só roda se tiver passado pelo check de login
                aplicarPermissoes();
                carregarBalanco();
            }
        };
    </script>
</body>
</html>
